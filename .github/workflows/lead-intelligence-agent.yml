name: Lead Intelligence Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "projects/lead-intelligence-agent/data/**"
      - "projects/lead-intelligence-agent/src/**"
      - "projects/lead-intelligence-agent/requirements.txt"

permissions:
  contents: write

jobs:
  qualify-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/lead-intelligence-agent/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r projects/lead-intelligence-agent/requirements.txt

      - name: Run autonomous qualification
        run: python projects/lead-intelligence-agent/src/qualify_leads.py

      - name: Commit updated report when needed
        run: |
          if git diff --quiet -- projects/lead-intelligence-agent/output; then
            echo "No output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/lead-intelligence-agent/output
          git commit -m "chore: refresh autonomous lead qualification"
          git push
